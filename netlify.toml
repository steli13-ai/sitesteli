[build]
  command = "npm run build"
  publish = "build"

# SPA fallback so client-side routes work on hard refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Ensure the service worker is always up to date
[[headers]]
  for = "/sw.js"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

# HTML should not be aggressively cached
[[headers]]
  for = "/index.html"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"

# PWA manifest moderate caching
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    cache-control = "public, max-age=86400"

  # --- Security & Performance Headers ---
  [[headers]]
    for = "/*"
    [headers.values]
      X-Content-Type-Options = "nosniff"
      X-Frame-Options = "DENY"
      Referrer-Policy = "strict-origin-when-cross-origin"
      X-XSS-Protection = "0"
      Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), payment=(self)"
      Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
      Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.rocket.new; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://static.rocket.new; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
