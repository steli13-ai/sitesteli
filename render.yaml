services:
  - type: static_site
    name: math4all
    env: static
    buildCommand: npm run build
    publishPath: build
    headers:
      - path: /
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://images.unsplash.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://api.render.com; frame-src 'self' https://www.youtube.com; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: cache-control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: cache-control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: cache-control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: cache-control
        value: public, max-age=86400
    routes:
      - type: rewrite
        source: /(.*)
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
