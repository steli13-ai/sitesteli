<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <title>Offline - Mate cu succes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ești offline. Conținutul critic nu este disponibil fără conexiune." />
  <style>
    body {font-family: Inter, system-ui, sans-serif; margin:0; padding:0; background:#f8f9fb; color:#222; display:flex; min-height:100vh; align-items:center; justify-content:center;}
    .card{max-width:420px; background:#fff; padding:2rem 2.25rem; border-radius:16px; box-shadow:0 4px 18px rgba(0,0,0,0.08);}
    h1{font-size:1.5rem; margin:0 0 .75rem;font-family:"Baloo 2", cursive; color:#1CA37B;}
    p{line-height:1.4; margin:.5rem 0 1.25rem;}
    button{background:#1CA37B; border:none; color:#fff; padding:.75rem 1.25rem; border-radius:8px; cursor:pointer; font-size:.95rem; font-weight:500;}
    button:hover{background:#16906c;}
  </style>
</head>
<body>
  <div class="card" role="alert" aria-live="polite">
    <h1>Ești offline</h1>
    <p>Nu putem încărca pagina cerută. Verifică conexiunea la internet.
      Resursele statice pot fi încă disponibile dacă au fost vizitate înainte.</p>
    <button onclick="window.location.href='/'">Reîncearcă</button>
  </div>
</body>
</html>
